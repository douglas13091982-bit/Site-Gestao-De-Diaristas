<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Gersepa Solutions</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #f0faf5 0%, #d1fae5 100%);
        color: #0f2a2a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 20px 60px -20px rgba(16, 185, 129, 0.35);
      }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; color: #065f46; }
      p { color: #475569; margin: 0 0 20px; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 24px;
        border-radius: 999px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Gersepa" />
      <h1>Você está sem conexão</h1>
      <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
